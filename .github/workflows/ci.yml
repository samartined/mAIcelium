name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

jobs:
  test:
    name: pytest (${{ matrix.os }} / py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Enable git symlinks on Windows
        if: runner.os == 'Windows'
        run: git config --global core.symlinks true

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dev deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Assert symlink privilege (Windows)
        if: runner.os == 'Windows'
        shell: python
        run: |
          import sys, os
          sys.path.insert(0, "bin")
          from _lib.platform import check_symlink_privilege
          ok = check_symlink_privilege()
          print(f"symlink privilege: {ok}", flush=True)
          sys.exit(0 if ok else 1)

      - name: Run tests
        run: python -m pytest -v --tb=short --junitxml=pytest-report.xml

      - name: Assert no tests were skipped (privileged runner)
        # NOTE: This guard intentionally fails on ANY skipped count > 0,
        # including xfail (which JUnit reports as "skipped").  Today this is
        # safe because the only skip-capable marker is @pytest.mark.requires_symlink,
        # which must NOT skip on a privileged runner.  If a future test adds an
        # unrelated @pytest.mark.skip or xfail and this job turns RED, that is
        # by design: the privileged matrix must run every test.  Adjust the guard
        # (e.g., filter by marker name) only if the intentional skip is unavoidable.
        shell: python
        run: |
          import sys
          import xml.etree.ElementTree as ET

          tree = ET.parse("pytest-report.xml")
          root = tree.getroot()

          # Sum skipped across all <testsuite> elements (handles both single and
          # nested layouts produced by different pytest/junit-xml versions).
          suites = root.findall("testsuite") or [root]
          total_skipped = sum(
              int(suite.get("skipped", 0)) for suite in suites
          )

          if total_skipped > 0:
              print(
                  f"::error::Privileged runner skipped {total_skipped} test(s)."
                  " All symlink tests must run here."
              )
              sys.exit(1)
          print("Skip guard passed: 0 skipped tests on privileged runner.")

  test-no-symlink:
    name: pytest (no-symlink simulation)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install dev deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Run tests with symlinks forced off
        env:
          MAICELIUM_FORCE_NO_SYMLINK: "1"
        run: python -m pytest -v --tb=short --junitxml=pytest-report.xml

      - name: Assert some tests were skipped (no-symlink simulation)
        shell: python
        run: |
          import sys
          import xml.etree.ElementTree as ET

          tree = ET.parse("pytest-report.xml")
          root = tree.getroot()

          suites = root.findall("testsuite") or [root]
          total_skipped = sum(
              int(suite.get("skipped", 0)) for suite in suites
          )

          if total_skipped == 0:
              print(
                  "::error::No-symlink simulation produced 0 skips."
                  " MAICELIUM_FORCE_NO_SYMLINK=1 must cause requires_symlink"
                  " tests to be skipped."
              )
              sys.exit(1)
          print(
              f"No-symlink guard passed: {total_skipped} test(s) skipped"
              " as expected under MAICELIUM_FORCE_NO_SYMLINK=1."
          )

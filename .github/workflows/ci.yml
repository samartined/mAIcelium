name: CI

on:
  push:
    branches: [main, dev]
  # No `branches:` filter here on purpose. Feature work in this repo is routinely
  # stacked — a branch is opened against the feature branch it was cut from, not
  # against main/dev (e.g. #34 -> feat/mai-cli -> dev). With a [main, dev] filter
  # those PRs matched nothing, so the whole matrix silently never ran and the PR
  # went green on the title lint alone. Every pull request gets tested, whatever
  # its base; the push filter above keeps feature-branch pushes from double-running.
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: pytest (${{ matrix.os }} / py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Enable git symlinks on Windows
        if: runner.os == 'Windows'
        run: git config --global core.symlinks true

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dev deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Assert symlink privilege (Windows)
        if: runner.os == 'Windows'
        shell: python
        run: |
          import sys, os
          sys.path.insert(0, "bin")
          from _lib.platform import check_symlink_privilege
          ok = check_symlink_privilege()
          print(f"symlink privilege: {ok}", flush=True)
          sys.exit(0 if ok else 1)

      - name: Run tests
        # Deselect (NOT skip) install-marked tests: they need build tooling /
        # `pip install -e .` and run only in the mai-install job below. Deselection
        # is not reported as "skipped" in JUnit, so the skip-guard stays at 0.
        run: python -m pytest -v --tb=short -m "not install" --junitxml=pytest-report.xml

      - name: Assert no tests were skipped (privileged runner)
        # NOTE: This guard intentionally fails on ANY skipped count > 0,
        # including xfail (which JUnit reports as "skipped").  Today this is
        # safe because the only skip-capable marker is @pytest.mark.requires_symlink,
        # which must NOT skip on a privileged runner.  If a future test adds an
        # unrelated @pytest.mark.skip or xfail and this job turns RED, that is
        # by design: the privileged matrix must run every test.  Adjust the guard
        # (e.g., filter by marker name) only if the intentional skip is unavoidable.
        shell: python
        run: |
          import sys
          import xml.etree.ElementTree as ET

          tree = ET.parse("pytest-report.xml")
          root = tree.getroot()

          # Sum skipped across all <testsuite> elements (handles both single and
          # nested layouts produced by different pytest/junit-xml versions).
          suites = root.findall("testsuite") or [root]
          total_skipped = sum(
              int(suite.get("skipped", 0)) for suite in suites
          )

          if total_skipped > 0:
              print(
                  f"::error::Privileged runner skipped {total_skipped} test(s)."
                  " All symlink tests must run here."
              )
              sys.exit(1)
          print("Skip guard passed: 0 skipped tests on privileged runner.")

  test-no-symlink:
    name: pytest (no-symlink simulation)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install dev deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Run tests with symlinks forced off
        env:
          MAICELIUM_FORCE_NO_SYMLINK: "1"
        # Same install deselection as the privileged matrix. The requires_symlink
        # CLI tests SKIP here under MAICELIUM_FORCE_NO_SYMLINK=1, feeding the
        # skips>0 assertion below.
        run: python -m pytest -v --tb=short -m "not install" --junitxml=pytest-report.xml

      - name: Assert some tests were skipped (no-symlink simulation)
        shell: python
        run: |
          import sys
          import xml.etree.ElementTree as ET

          tree = ET.parse("pytest-report.xml")
          root = tree.getroot()

          suites = root.findall("testsuite") or [root]
          total_skipped = sum(
              int(suite.get("skipped", 0)) for suite in suites
          )

          if total_skipped == 0:
              print(
                  "::error::No-symlink simulation produced 0 skips."
                  " MAICELIUM_FORCE_NO_SYMLINK=1 must cause requires_symlink"
                  " tests to be skipped."
              )
              sys.exit(1)
          print(
              f"No-symlink guard passed: {total_skipped} test(s) skipped"
              " as expected under MAICELIUM_FORCE_NO_SYMLINK=1."
          )

  mai-install:
    name: mai install (${{ matrix.os }} / py3.11)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Enable git symlinks on Windows
        if: runner.os == 'Windows'
        run: git config --global core.symlinks true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install test + build tooling
        # `build` is intentionally NOT in requirements-dev.txt; it is only needed
        # for the wheel test (PK-5) and lives in this job alone.
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install build

      - name: Editable install (build-succeeds gate, PK-4)
        run: pip install -e .

      - name: Run install-marked tests
        run: python -m pytest -v --tb=short -m "install" --junitxml=pytest-install-report.xml

      - name: mai sanity — real console script / mai.exe
        # On Windows this runs the entry-point-generated mai.exe; on POSIX the
        # generated console script. Exercises the real launcher, not just a
        # static shim assertion.
        run: |
          mai --version
          mai --help

      - name: Assert clean tree (PK-6 backstop)
        shell: bash
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::Editable install / build left untracked artifacts:"
            git status --porcelain
            exit 1
          fi
          echo "Clean-tree guard passed: no build artifacts dirty the tree."
